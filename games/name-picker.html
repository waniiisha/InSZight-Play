<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Claw 3D - BilikBBM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #f472b6;
      --accent: #818cf8;
      --bg: #0b0f19;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .header {
      background: rgba(15, 23, 42, 0.95);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #312e81;
    }

    .btn-back {
      text-decoration: none;
      color: #94a3b8;
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stage-wrapper {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 12px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* KABINET ARKED 3D SEBENAR */
    .arcade-chassis {
      width: 100%;
      background: linear-gradient(180deg, #1e40af 0%, #1e3a8a 100%);
      border-radius: 28px;
      border: 4px solid #3b82f6;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 4px 0 #93c5fd;
      padding: 12px;
      position: relative;
    }

    .led-strip-l, .led-strip-r {
      position: absolute;
      top: 14px;
      bottom: 84px;
      width: 14px;
      border-radius: 99px;
      background: repeating-linear-gradient(180deg, #facc15, #facc15 12px, #1d4ed8 12px, #1d4ed8 24px);
      box-shadow: 0 0 16px #facc15;
      z-index: 25;
    }
    .led-strip-l { left: 4px; }
    .led-strip-r { right: 4px; }

    /* RUANG KACA ISOMETRIK BERKEDALAMAN */
    .glass-room {
      width: 100%;
      height: 380px;
      background: linear-gradient(180deg, #075985 0%, #0369a1 40%, #082f49 100%);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      border: 3px solid #38bdf8;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.85);
    }

    /* Dinding & Kedalaman 3D Dalaman */
    .chamber-depth-wall {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: 
        linear-gradient(90deg, rgba(0,0,0,0.6) 0%, transparent 18%, transparent 82%, rgba(0,0,0,0.6) 100%),
        linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 3;
    }

    .glass-reflection {
      position: absolute;
      inset: 0;
      background: linear-gradient(130deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.04) 30%, transparent 60%);
      pointer-events: none;
      z-index: 30;
    }

    .rail-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 18px;
      background: linear-gradient(180deg, #64748b 0%, #0f172a 100%);
      border-bottom: 2px solid #000;
      z-index: 15;
    }

    /* KREN & CAKAR KUNING METALIK BESAR */
    .claw-unit {
      position: absolute;
      top: 10px;
      left: 65%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
      transition: left 0.1s linear;
    }

    .crane-box {
      width: 66px;
      height: 32px;
      background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
      border-radius: 8px;
      border: 3px solid #713f12;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crane-core {
      width: 22px;
      height: 12px;
      background: #ef4444;
      border-radius: 4px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .crane-wire {
      width: 6px;
      height: 35px;
      background: repeating-linear-gradient(180deg, #cbd5e1, #cbd5e1 5px, #334155 5px, #334155 10px);
      transition: height 0.85s cubic-bezier(0.3, 0, 0.2, 1);
    }

    /* Kuku Cakar 3D Bersendi */
    .claw-pincers {
      width: 58px;
      height: 52px;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .pincer-leg {
      position: absolute;
      width: 10px;
      height: 48px;
      background: linear-gradient(180deg, #fef08a 0%, #eab308 60%, #854d0e 100%);
      border: 2px solid #713f12;
      border-radius: 6px;
      transition: transform 0.35s ease;
      z-index: 2;
    }

    .pincer-l {
      left: 0;
      top: 0;
      transform-origin: top left;
      transform: rotate(30deg);
      border-bottom-left-radius: 18px;
    }

    .pincer-r {
      right: 0;
      top: 0;
      transform-origin: top right;
      transform: rotate(-30deg);
      border-bottom-right-radius: 18px;
    }

    /* Patung Terangkat */
    .held-doll {
      position: absolute;
      top: 14px;
      width: 50px;
      height: 50px;
      z-index: 1;
      display: none;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
      animation: wiggleDoll 0.4s ease-in-out infinite alternate;
    }

    /* CORONG HADIAH KIRI BERKEDALAMAN */
    .prize-drop {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 105px;
      height: 165px;
      background: linear-gradient(145deg, #1e3a8a 0%, #0f172a 100%);
      border-top: 5px solid #60a5fa;
      border-right: 5px solid #60a5fa;
      border-top-right-radius: 24px;
      box-shadow: inset -10px 10px 24px rgba(0,0,0,0.9), 6px 0 20px rgba(0,0,0,0.5);
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #93c5fd;
      font-weight: 900;
      font-size: 0.75rem;
    }

    .prize-drop i {
      font-size: 2rem;
      color: #facc15;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 10px #facc15);
    }

    /* TIMBUNAN PATUNG BERTINDIH-TINDIH (BERSERAK RAWAK) */
    .plushie-pit {
      position: absolute;
      bottom: 0;
      left: 95px;
      right: 0;
      height: 175px;
      z-index: 10;
      pointer-events: none;
    }

    .pit-doll {
      position: absolute;
      width: 58px;
      height: 58px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6));
      animation: dollBreathe 3s ease-in-out infinite alternate;
    }

    .pit-doll svg, .held-doll svg {
      width: 100%;
      height: 100%;
    }

    /* DEK KAWALAN ARKED */
    .arcade-deck {
      margin-top: 10px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-radius: 22px;
      padding: 12px 18px;
      border: 3px solid #3b82f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.15), 0 8px 24px rgba(0,0,0,0.6);
    }

    .stick-arrows {
      display: flex;
      gap: 10px;
    }

    .btn-steer {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      border: 3px solid #475569;
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      color: #ffffff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #0f172a, 0 6px 12px rgba(0,0,0,0.4);
    }

    .btn-steer:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0f172a;
      background: #475569;
    }

    .btn-grab-big {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 4px solid #991b1b;
      background: radial-gradient(circle at 35% 35%, #f87171 0%, #ef4444 45%, #991b1b 100%);
      color: white;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 8px 0 #7f1d1d, 0 14px 28px rgba(239, 68, 68, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-grab-big:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #7f1d1d;
    }

    .btn-grab-big:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* PENGURUSAN NAMA */
    .names-box {
      width: 100%;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 20px;
      padding: 16px 18px;
      border: 2px solid #475569;
      margin-top: 14px;
    }

    .names-box textarea {
      width: 100%;
      height: 85px;
      border-radius: 12px;
      border: 1.5px solid #64748b;
      background: #0f172a;
      color: white;
      padding: 10px;
      font-size: 0.9rem;
      outline: none;
      margin-top: 8px;
      resize: vertical;
      user-select: text;
    }

    /* MODAL TAHNIAH */
    .modal-winner {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .winner-sheet {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      padding: 30px 24px;
      border-radius: 28px;
      text-align: center;
      width: 100%;
      max-width: 380px;
      border: 4px solid #facc15;
      box-shadow: 0 20px 50px rgba(250, 204, 21, 0.45);
    }

    .winner-sheet h2 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #facc15;
      margin: 12px 0 20px;
      text-shadow: 0 4px 12px rgba(250, 204, 21, 0.4);
    }

    .btn-again {
      width: 100%;
      padding: 14px;
      border-radius: 99px;
      border: none;
      background: linear-gradient(135deg, #f472b6, #818cf8);
      color: white;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
    }

    @keyframes dollBreathe {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }
    @keyframes wiggleDoll {
      from { transform: rotate(-5deg); }
      to { transform: rotate(5deg); }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="../index.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Menu Utama
    </a>
    <span style="font-weight: 900; color: #facc15;">🕹️ 3D ARCADIA CLAW</span>
  </header>

  <div class="stage-wrapper">
    <div class="arcade-chassis">
      <div class="led-strip-l"></div>
      <div class="led-strip-r"></div>

      <div class="glass-room">
        <div class="glass-reflection"></div>
        <div class="chamber-depth-wall"></div>
        <div class="rail-bar"></div>

        <!-- Mekanisme Kren & Cakar -->
        <div class="claw-unit" id="claw-unit" style="left: 65%;">
          <div class="crane-box"><div class="crane-core"></div></div>
          <div class="crane-wire" id="crane-wire"></div>
          <div class="claw-pincers">
            <div class="pincer-leg pincer-l" id="pin-l"></div>
            <div class="pincer-leg pincer-r" id="pin-r"></div>
            <!-- Patung Yang Dicengkam -->
            <div class="held-doll" id="held-doll"></div>
          </div>
        </div>

        <!-- Corong Hadiah Kiri -->
        <div class="prize-drop">
          <i class="fa-solid fa-gift"></i>
          <span>PRIZE<br>DROP</span>
        </div>

        <!-- Timbunan Patung Haiwan Penuh Berselerak -->
        <div class="plushie-pit" id="pit-container"></div>
      </div>

      <!-- DEK KAWALAN -->
      <div class="arcade-deck">
        <div class="stick-arrows">
          <button class="btn-steer" id="btn-left"><i class="fa-solid fa-arrow-left"></i></button>
          <button class="btn-steer" id="btn-right"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <button class="btn-grab-big" id="btn-grab" onclick="actionGrab()">
          GRAB
        </button>
      </div>
    </div>

    <!-- PENGURUSAN NAMA MURID -->
    <div class="names-box">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label style="font-weight: 800; font-size: 0.88rem;">
          <i class="fa-solid fa-users" style="color: #facc15;"></i> Senarai Nama Murid:
        </label>
        <span id="name-count" style="font-size: 0.78rem; font-weight: 800; color: #f472b6;">8 Nama</span>
      </div>

      <textarea id="names-text" placeholder="Tampal nama murid di sini (satu nama setiap baris)..." oninput="onNamesChanged()"></textarea>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
        <label style="font-size: 0.82rem; color: #94a3b8; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="chk-auto" checked>
          <span>Singkir nama yang terpilih</span>
        </label>
        <button onclick="restoreNames()" style="background: none; border: none; color: #38bdf8; font-size: 0.78rem; text-decoration: underline; cursor: pointer;">
          Reset Senarai
        </button>
      </div>
    </div>
  </div>

  <!-- POP-UP TAHNIAH -->
  <div class="modal-winner" id="winner-modal">
    <div class="winner-sheet">
      <div id="winner-doll-avatar" style="width: 75px; height: 75px; margin: 0 auto 10px;"></div>
      <p style="font-size: 0.85rem; font-weight: 800; color: #94a3b8; letter-spacing: 1px;">PATUNG BERJAYA DICAKAR UNTUK</p>
      <h2 id="winner-name">-</h2>
      <button class="btn-again" onclick="closeWinner()">Cabut Seterusnya</button>
    </div>
  </div>

  <script>
    // Koleksi Maskot Haiwan 3D SVG Vektor
    const animalSVGs = [
      // 1. Kucing Pink Bulat
      `<svg viewBox="0 0 100 100">
        <circle cx="26" cy="26" r="14" fill="#ec4899"/>
        <circle cx="26" cy="26" r="8" fill="#fbcfe8"/>
        <circle cx="74" cy="26" r="14" fill="#ec4899"/>
        <circle cx="74" cy="26" r="8" fill="#fbcfe8"/>
        <circle cx="50" cy="56" r="38" fill="#f472b6"/>
        <circle cx="50" cy="52" r="32" fill="#f472b6"/>
        <circle cx="36" cy="48" r="5.5" fill="#1e1b4b"/><circle cx="38" cy="46" r="2" fill="#ffffff"/>
        <circle cx="64" cy="48" r="5.5" fill="#1e1b4b"/><circle cx="66" cy="46" r="2" fill="#ffffff"/>
        <circle cx="30" cy="56" r="5" fill="#f43f5e" opacity="0.6"/>
        <circle cx="70" cy="56" r="5" fill="#f43f5e" opacity="0.6"/>
        <polygon points="50,54 46,58 54,58" fill="#be185d"/>
        <path d="M 45 61 Q 50 64 55 61" stroke="#be185d" stroke-width="2.5" fill="none"/>
      </svg>`,

      // 2. Katak Hijau Comel
      `<svg viewBox="0 0 100 100">
        <circle cx="30" cy="28" r="15" fill="#16a34a"/>
        <circle cx="30" cy="28" r="9" fill="#ffffff"/>
        <circle cx="30" cy="28" r="4.5" fill="#0f172a"/>
        <circle cx="70" cy="28" r="15" fill="#16a34a"/>
        <circle cx="70" cy="28" r="9" fill="#ffffff"/>
        <circle cx="70" cy="28" r="4.5" fill="#0f172a"/>
        <ellipse cx="50" cy="60" rx="38" ry="32" fill="#22c55e"/>
        <ellipse cx="50" cy="64" rx="26" ry="18" fill="#86efac"/>
        <circle cx="30" cy="60" r="5" fill="#f472b6" opacity="0.7"/>
        <circle cx="70" cy="60" r="5" fill="#f472b6" opacity="0.7"/>
        <path d="M 38 64 Q 50 75 62 64" stroke="#14532d" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>`,

      // 3. Anak Ayam Kuning
      `<svg viewBox="0 0 100 100">
        <circle cx="50" cy="54" r="38" fill="#eab308"/>
        <circle cx="50" cy="50" r="34" fill="#facc15"/>
        <ellipse cx="14" cy="56" rx="6" ry="12" fill="#ca8a04" transform="rotate(20 14 56)"/>
        <ellipse cx="86" cy="56" rx="6" ry="12" fill="#ca8a04" transform="rotate(-20 86 56)"/>
        <circle cx="36" cy="46" r="4.5" fill="#0f172a"/><circle cx="37" cy="44" r="1.5" fill="#ffffff"/>
        <circle cx="64" cy="46" r="4.5" fill="#0f172a"/><circle cx="65" cy="44" r="1.5" fill="#ffffff"/>
        <circle cx="28" cy="54" r="4.5" fill="#ea580c" opacity="0.6"/>
        <circle cx="72" cy="54" r="4.5" fill="#ea580c" opacity="0.6"/>
        <polygon points="50,48 43,58 57,58" fill="#ea580c"/>
      </svg>`,

      // 4. Arnab Ungu Pastel
      `<svg viewBox="0 0 100 100">
        <ellipse cx="34" cy="20" rx="8" ry="20" fill="#a855f7"/>
        <ellipse cx="34" cy="20" rx="4" ry="14" fill="#fbcfe8"/>
        <ellipse cx="66" cy="20" rx="8" ry="20" fill="#a855f7"/>
        <ellipse cx="66" cy="20" rx="4" ry="14" fill="#fbcfe8"/>
        <circle cx="50" cy="58" r="36" fill="#c084fc"/>
        <circle cx="36" cy="52" r="5" fill="#1e1b4b"/><circle cx="38" cy="50" r="1.5" fill="#ffffff"/>
        <circle cx="64" cy="52" r="5" fill="#1e1b4b"/><circle cx="66" cy="50" r="1.5" fill="#ffffff"/>
        <circle cx="28" cy="60" r="4" fill="#f43f5e" opacity="0.5"/>
        <circle cx="72" cy="60" r="4" fill="#f43f5e" opacity="0.5"/>
        <polygon points="50,59 46,64 54,64" fill="#db2777"/>
      </svg>`,

      // 5. Beruang Oren Monster Comel
      `<svg viewBox="0 0 100 100">
        <circle cx="28" cy="28" r="12" fill="#c2410c"/>
        <circle cx="72" cy="28" r="12" fill="#c2410c"/>
        <circle cx="50" cy="58" r="36" fill="#f97316"/>
        <circle cx="50" cy="56" r="30" fill="#fb923c"/>
        <circle cx="38" cy="50" r="5" fill="#1e1b4b"/><circle cx="39" cy="48" r="2" fill="#ffffff"/>
        <circle cx="62" cy="50" r="5" fill="#1e1b4b"/><circle cx="63" cy="48" r="2" fill="#ffffff"/>
        <ellipse cx="50" cy="64" rx="14" ry="10" fill="#fed7aa"/>
        <polygon points="50,59 47,63 53,63" fill="#7c2d12"/>
      </svg>`
    ];

    // Tetapan Posisi Timbunan Berselerak (Tersusun Rawak Berkedalaman)
    const pileLayout = [
      { bottom: '15px', left: '10px', rot: '-12deg', scale: '0.9', z: '1' },
      { bottom: '20px', left: '60px', rot: '8deg', scale: '0.95', z: '2' },
      { bottom: '10px', left: '120px', rot: '-6deg', scale: '1.05', z: '4' },
      { bottom: '18px', left: '175px', rot: '14deg', scale: '0.9', z: '2' },
      { bottom: '25px', left: '225px', rot: '-10deg', scale: '0.85', z: '1' },
      { bottom: '55px', left: '30px', rot: '15deg', scale: '1.0', z: '5' },
      { bottom: '60px', left: '90px', rot: '-18deg', scale: '1.1', z: '6' },
      { bottom: '50px', left: '150px', rot: '5deg', scale: '1.0', z: '5' },
      { bottom: '65px', left: '205px', rot: '-12deg', scale: '0.95', z: '4' },
      { bottom: '95px', left: '55px', rot: '-8deg', scale: '1.05', z: '8' },
      { bottom: '100px', left: '120px', rot: '12deg', scale: '1.15', z: '9' },
      { bottom: '90px', left: '180px', rot: '-14deg', scale: '1.0', z: '7' }
    ];

    const defaultNames = ['Ahmad', 'Sarah', 'Danish', 'Aisyah', 'Chong', 'Muthu', 'Haziq', 'Nurul'];
    let studentList = JSON.parse(localStorage.getItem('bbm_names')) || defaultNames;

    let clawX = 65;
    let busy = false;
    let holdTimer = null;
    let grabbedSvg = '';

    const clawUnit = document.getElementById('claw-unit');
    const craneWire = document.getElementById('crane-wire');
    const pinL = document.getElementById('pin-l');
    const pinR = document.getElementById('pin-r');
    const heldDoll = document.getElementById('held-doll');
    const btnGrab = document.getElementById('btn-grab');

    // Bina timbunan patung penuh berkedalaman
    function renderPile() {
      const container = document.getElementById('pit-container');
      container.innerHTML = pileLayout.map((pos, idx) => `
        <div class="pit-doll" id="pile-item-${idx}" style="
          bottom: ${pos.bottom}; 
          left: ${pos.left}; 
          transform: rotate(${pos.rot}) scale(${pos.scale}); 
          z-index: ${pos.z};
          animation-delay: ${(idx * 0.25)}s;
        ">
          ${animalSVGs[idx % animalSVGs.length]}
        </div>
      `).join('');
    }

    function sync() {
      localStorage.setItem('bbm_names', JSON.stringify(studentList));
      document.getElementById('name-count').textContent = studentList.length + ' Nama';
    }

    function onNamesChanged() {
      const val = document.getElementById('names-text').value;
      studentList = val.split('\n').map(s => s.trim()).filter(Boolean);
      sync();
    }

    function restoreNames() {
      studentList = [...defaultNames];
      document.getElementById('names-text').value = studentList.join('\n');
      sync();
    }

    // KAWALAN PERGERAKAN CRANE
    function goLeft() {
      if (busy || clawX <= 32) return;
      clawX -= 3.5;
      if (clawX < 32) clawX = 32;
      clawUnit.style.left = clawX + '%';
    }

    function goRight() {
      if (busy || clawX >= 86) return;
      clawX += 3.5;
      if (clawX > 86) clawX = 86;
      clawUnit.style.left = clawX + '%';
    }

    function bindHold(btn, action) {
      btn.addEventListener('mousedown', () => { action(); holdTimer = setInterval(action, 80); });
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); action(); holdTimer = setInterval(action, 80); });
      window.addEventListener('mouseup', () => clearInterval(holdTimer));
      window.addEventListener('touchend', () => clearInterval(holdTimer));
    }
    bindHold(document.getElementById('btn-left'), goLeft);
    bindHold(document.getElementById('btn-right'), goRight);

    // KAWALAN PAPAN KEKUNCI (TIDAK GANGGU RUANG INPUT TEXTAREA)
    window.addEventListener('keydown', (e) => {
      // Pastikan guru tidak sedang menaip di dalam kotak senarai nama
      if (document.activeElement.id === 'names-text') return;

      if (e.key === 'ArrowLeft') goLeft();
      if (e.key === 'ArrowRight') goRight();
      if (e.key === ' ') actionGrab();
    });

    // MEKANIK GRAB NYATA
    function actionGrab() {
      if (busy) return;
      if (studentList.length === 0) {
        alert('Sila masukkan sekurang-kurangnya 1 nama murid!');
        return;
      }

      busy = true;
      btnGrab.disabled = true;

      const luckyIndex = Math.floor(Math.random() * studentList.length);
      const winnerName = studentList[luckyIndex];
      const randomDollIdx = Math.floor(Math.random() * animalSVGs.length);
      grabbedSvg = animalSVGs[randomDollIdx];

      // 1. Cakar Turun Mendalam Menyentuh Patung (220px)
      craneWire.style.height = '220px';

      setTimeout(() => {
        // 2. Kuku Menutup Mencengkam Patung
        pinL.style.transform = 'rotate(48deg)';
        pinR.style.transform = 'rotate(-48deg)';

        heldDoll.innerHTML = grabbedSvg;
        heldDoll.style.display = 'block';

        setTimeout(() => {
          // 3. Tarik Naik Semula Bersama Patung
          craneWire.style.height = '35px';

          setTimeout(() => {
            // 4. Luncur ke Kiri Menuju Corong Hadiah (18%)
            clawUnit.style.transition = 'left 1.1s cubic-bezier(0.4, 0, 0.2, 1)';
            clawUnit.style.left = '18%';

            setTimeout(() => {
              // 5. Buka Kuku & Lepaskan Patung Jatuh ke Corong Hadiah
              pinL.style.transform = 'rotate(30deg)';
              pinR.style.transform = 'rotate(-30deg)';

              heldDoll.style.transition = 'top 0.4s ease-in, opacity 0.4s ease-in';
              heldDoll.style.top = '130px';
              heldDoll.style.opacity = '0';

              setTimeout(() => {
                // 6. Paparkan Pemenang dengan Konfeti
                showWinner(winnerName, luckyIndex);
              }, 450);
            }, 1150);
          }, 900);
        }, 550);
      }, 900);
    }

    function showWinner(name, idx) {
      if (window.confetti) {
        confetti({ particleCount: 130, spread: 80, origin: { y: 0.6 } });
      }

      document.getElementById('winner-name').textContent = name;
      document.getElementById('winner-doll-avatar').innerHTML = grabbedSvg;
      document.getElementById('winner-modal').style.display = 'flex';

      if (document.getElementById('chk-auto').checked) {
        studentList.splice(idx, 1);
        document.getElementById('names-text').value = studentList.join('\n');
        sync();
      }
    }

    function closeWinner() {
      document.getElementById('winner-modal').style.display = 'none';

      heldDoll.style.display = 'none';
      heldDoll.style.top = '14px';
      heldDoll.style.opacity = '1';
      heldDoll.style.transition = 'none';

      // Kembalikan kren ke posisi sedia
      clawX = 65;
      clawUnit.style.transition = 'left 0.7s ease';
      clawUnit.style.left = '65%';

      setTimeout(() => {
        clawUnit.style.transition = 'left 0.1s linear';
        busy = false;
        btnGrab.disabled = false;
      }, 700);
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('names-text').value = studentList.join('\n');
      sync();
      renderPile();
    });
  </script>
</body>
</html>
