<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Picker Interaktif - BilikBBM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #f472b6;
      --primary-hover: #ec4899;
      --accent: #a78bfa;
      --bg: #fdf2f8;
      --card: #ffffff;
      --text: #334155;
      --border: #fbcfe8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(244, 114, 182, 0.1);
    }

    .btn-back {
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tabs-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 14px 12px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 99px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.3);
    }

    .stage-container {
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-screen {
      width: 100%;
      height: 320px;
      background: #ffffff;
      border-radius: 28px;
      border: 3px solid var(--border);
      box-shadow: 0 8px 25px rgba(244, 114, 182, 0.12);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animasi Claw */
    .claw-box {
      width: 100%;
      height: 100%;
      position: relative;
      background: linear-gradient(180deg, #fce7f3 0%, #ffffff 60%);
    }

    .claw-crane {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      transition: all 0.6s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    .claw-string {
      width: 4px;
      height: 50px;
      background: #94a3b8;
      transition: height 0.6s ease;
    }

    .claw-fingers {
      font-size: 28px;
      color: #ec4899;
      line-height: 1;
    }

    .balls-pit {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 15px;
    }

    .ball-toy {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      box-shadow: inset -4px -4px 0 rgba(0,0,0,0.12);
      animation: bounce 1.8s ease-in-out infinite alternate;
    }

    /* Animasi Balloon */
    .balloon-area {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 20px;
      background: #fff;
    }

    .single-balloon {
      width: 52px;
      height: 68px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      animation: floatB 2.2s ease-in-out infinite alternate;
      cursor: pointer;
      position: relative;
    }

    /* Animasi Fishing */
    .pond-area {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #bae6fd 0%, #38bdf8 100%);
      position: relative;
      overflow: hidden;
    }

    .fish-actor {
      position: absolute;
      font-size: 2.2rem;
      animation: fishSwim 6s linear infinite;
    }

    .fishing-rod-line {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 26px;
      color: #334155;
      transition: top 0.7s ease;
    }

    /* Butang Cabutan Utama */
    .action-btn {
      width: 100%;
      margin: 16px 0;
      padding: 14px 20px;
      border-radius: 99px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(244, 114, 182, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-btn:disabled {
      opacity: 0.6;
    }

    /* Bahagian Pengurusan Nama Terbuka */
    .names-manager {
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 18px 20px;
      border: 1.5px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .names-manager textarea {
      width: 100%;
      height: 90px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      padding: 10px;
      font-size: 0.9rem;
      outline: none;
      margin-top: 8px;
      resize: vertical;
    }

    .row-settings {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Modal Pengumuman Nama */
    .modal-winner {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .card-winner {
      background: white;
      padding: 28px 24px;
      border-radius: 24px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      border: 3px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .card-winner h2 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-hover);
      margin: 12px 0 20px;
      word-break: break-word;
    }

    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    @keyframes floatB { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    @keyframes fishSwim {
      0% { left: -15%; transform: scaleX(1); }
      49% { transform: scaleX(1); }
      50% { left: 105%; transform: scaleX(-1); }
      100% { left: -15%; transform: scaleX(-1); }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="../index.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Menu Utama
    </a>
    <span style="font-weight: 800; color: var(--primary);">BilikBBM</span>
  </header>

  <!-- Pilihan 3 Tema -->
  <div class="tabs-bar">
    <button class="tab-btn active" id="btn-claw" onclick="selectTheme('claw')">🕹️ Mesin Cakar</button>
    <button class="tab-btn" id="btn-balloon" onclick="selectTheme('balloon')">🎈 Letup Belon</button>
    <button class="tab-btn" id="btn-fishing" onclick="selectTheme('fishing')">🎣 Kolam Ikan</button>
  </div>

  <div class="stage-container">
    <!-- Skrin Arena Interaktif -->
    <div class="game-screen" id="arena-screen">
      <!-- Visual dimasukkan secara dinamik oleh JS -->
    </div>

    <!-- Butang Tindakan Utama -->
    <button class="action-btn" id="btn-spin" onclick="executeDraw()">
      <i class="fa-solid fa-play"></i> Mulakan Cabutan!
    </button>

    <!-- Tempat Masuk Senarai Nama Murid Secara Langsung -->
    <div class="names-manager">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label style="font-weight: 700; font-size: 0.9rem;">
          <i class="fa-solid fa-users" style="color: var(--primary);"></i> Senarai Nama Murid:
        </label>
        <span id="name-count" style="font-size: 0.78rem; font-weight: 700; color: #ec4899;">8 Nama</span>
      </div>
      
      <textarea id="names-text-input" placeholder="Tampal senarai nama di sini (satu nama setiap baris)..." oninput="updateNamesFromInput()"></textarea>

      <div class="row-settings">
        <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="chk-auto-remove" checked>
          <span>Buang nama selepas terpilih</span>
        </label>
        <button onclick="resetDefaultNames()" style="background: none; border: none; color: #94a3b8; font-size: 0.8rem; cursor: pointer; text-decoration: underline;">
          Pulih Senarai Asal
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Pemenang -->
  <div class="modal-winner" id="winner-modal">
    <div class="card-winner">
      <p style="font-size: 0.85rem; color: #64748b; font-weight: 700; text-transform: uppercase;">Tahniah Kepada</p>
      <h2 id="winner-name-display">-</h2>
      <button class="action-btn" style="padding: 10px;" onclick="closeModalWinner()">
        Cabut Seterusnya
      </button>
    </div>
  </div>

  <script>
    let activeTheme = 'claw';
    const defaultList = ['Ahmad', 'Sarah', 'Danish', 'Aisyah', 'Chong', 'Muthu', 'Haziq', 'Nurul'];
    let currentNames = JSON.parse(localStorage.getItem('bbm_names')) || defaultList;

    function saveNamesToStorage() {
      localStorage.setItem('bbm_names', JSON.stringify(currentNames));
      const countEl = document.getElementById('name-count');
      if (countEl) countEl.textContent = currentNames.length + ' Nama';
    }

    function updateNamesFromInput() {
      const val = document.getElementById('names-text-input').value;
      currentNames = val.split('\n').map(s => s.trim()).filter(Boolean);
      saveNamesToStorage();
      renderArena();
    }

    function resetDefaultNames() {
      currentNames = [...defaultList];
      document.getElementById('names-text-input').value = currentNames.join('\n');
      saveNamesToStorage();
      renderArena();
    }

    function selectTheme(theme) {
      activeTheme = theme;
      document.getElementById('btn-claw').classList.toggle('active', theme === 'claw');
      document.getElementById('btn-balloon').classList.toggle('active', theme === 'balloon');
      document.getElementById('btn-fishing').classList.toggle('active', theme === 'fishing');
      renderArena();
    }

    function renderArena() {
      const screen = document.getElementById('arena-screen');
      if (!screen) return;

      if (activeTheme === 'claw') {
        const colors = ['#f472b6', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa'];
        const ballsHtml = currentNames.slice(0, 8).map((_, i) => 
          `<div class="ball-toy" style="background: ${colors[i % colors.length]};"></div>`
        ).join('');

        screen.innerHTML = `
          <div class="claw-box">
            <div class="claw-crane" id="claw-crane">
              <div class="claw-string" id="claw-string"></div>
              <div class="claw-fingers"><i class="fa-solid fa-hand-fist"></i></div>
            </div>
            <div class="balls-pit">${ballsHtml || '<p style="color:#94a3b8; font-size:0.9rem;">Sila masukkan nama murid di bawah</p>'}</div>
          </div>
        `;
      } else if (activeTheme === 'balloon') {
        const colors = ['#f472b6', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa'];
        const balloonsHtml = currentNames.slice(0, 8).map((n, i) => 
          `<div class="single-balloon" onclick="executeDraw()" style="background: ${colors[i % colors.length]};"></div>`
        ).join('');

        screen.innerHTML = `
          <div class="balloon-area">
            ${balloonsHtml || '<p style="color:#94a3b8; font-size:0.9rem;">Sila masukkan nama murid di bawah</p>'}
          </div>
        `;
      } else if (activeTheme === 'fishing') {
        screen.innerHTML = `
          <div class="pond-area">
            <div class="fishing-rod-line" id="rod-hook"><i class="fa-solid fa-anchor"></i></div>
            <div class="fish-actor" style="top: 25%;"><i class="fa-solid fa-fish" style="color: #f97316;"></i></div>
            <div class="fish-actor" style="top: 60%; animation-duration: 7s;"><i class="fa-solid fa-fish" style="color: #ec4899;"></i></div>
            <div class="fish-actor" style="top: 80%; animation-duration: 4.5s;"><i class="fa-solid fa-shrimp" style="color: #ef4444;"></i></div>
          </div>
        `;
      }
    }

    function executeDraw() {
      if (currentNames.length === 0) {
        alert('Sila taipkan sekurang-kurangnya 1 nama murid dalam kotak senarai!');
        return;
      }

      const spinBtn = document.getElementById('btn-spin');
      spinBtn.disabled = true;

      const luckyIndex = Math.floor(Math.random() * currentNames.length);
      const chosenName = currentNames[luckyIndex];

      if (activeTheme === 'claw') {
        const crane = document.getElementById('claw-crane');
        const str = document.getElementById('claw-string');
        crane.style.left = '35%';
        setTimeout(() => {
          str.style.height = '140px';
          setTimeout(() => {
            str.style.height = '50px';
            setTimeout(() => {
              announceWinner(chosenName, luckyIndex);
            }, 600);
          }, 600);
        }, 400);
      } else if (activeTheme === 'fishing') {
        const hook = document.getElementById('rod-hook');
        hook.style.top = '120px';
        setTimeout(() => {
          hook.style.top = '-120px';
          setTimeout(() => {
            announceWinner(chosenName, luckyIndex);
          }, 600);
        }, 600);
      } else {
        // Balon
        announceWinner(chosenName, luckyIndex);
      }
    }

    function announceWinner(name, index) {
      if (window.confetti) {
        confetti({ particleCount: 90, spread: 65, origin: { y: 0.6 } });
      }

      document.getElementById('winner-name-display').textContent = name;
      document.getElementById('winner-modal').style.display = 'flex';

      if (document.getElementById('chk-auto-remove').checked) {
        currentNames.splice(index, 1);
        document.getElementById('names-text-input').value = currentNames.join('\n');
        saveNamesToStorage();
      }

      document.getElementById('btn-spin').disabled = false;
      renderArena();
    }

    function closeModalWinner() {
      document.getElementById('winner-modal').style.display = 'none';
      renderArena();
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('names-text-input').value = currentNames.join('\n');
      saveNamesToStorage();
      renderArena();
    });
  </script>
</body>
</html>
