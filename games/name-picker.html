<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Claw Machine - BilikBBM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #f472b6;
      --primary-hover: #ec4899;
      --accent: #a78bfa;
      --bg: #1e1b4b;
      --card-bg: #2e1065;
      --text: #ffffff;
      --border: #f472b6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #312e81 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #4338ca;
    }

    .btn-back {
      text-decoration: none;
      color: #cbd5e1;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-back:hover {
      color: #ffffff;
    }

    .game-wrapper {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 14px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* KABINET ARKED 3D */
    .arcade-frame {
      width: 100%;
      background: #3b82f6;
      border-radius: 26px;
      border: 4px solid #1d4ed8;
      box-shadow: 0 16px 36px rgba(0,0,0,0.5), inset 0 4px 0 #93c5fd, inset 0 -6px 0 #1e40af;
      padding: 12px 12px 14px;
      position: relative;
    }

    /* Tiang Lampu Neon Sisi */
    .neon-pillar-left, .neon-pillar-right {
      position: absolute;
      top: 14px;
      bottom: 70px;
      width: 14px;
      border-radius: 99px;
      background: repeating-linear-gradient(180deg, #facc15, #facc15 10px, #3b82f6 10px, #3b82f6 20px);
      box-shadow: 0 0 10px #facc15;
      z-index: 10;
    }
    .neon-pillar-left { left: 4px; }
    .neon-pillar-right { right: 4px; }

    /* Ruang Kaca Mesin Capit */
    .glass-chamber {
      width: 100%;
      height: 330px;
      background: linear-gradient(180deg, #0284c7 0%, #1e1b4b 75%);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      border: 3px solid #60a5fa;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
    }

    /* Pantulan Kaca */
    .glass-glare {
      position: absolute;
      top: 0;
      left: -20%;
      width: 50%;
      height: 100%;
      background: linear-gradient(105deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 60%);
      pointer-events: none;
      z-index: 12;
    }

    /* Rel Atas & Mekanisme Derek Kuning */
    .top-rail {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 16px;
      background: #1e293b;
      border-bottom: 2px solid #0f172a;
      z-index: 8;
    }

    .crane-carriage {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 9;
      transition: left 0.15s linear;
    }

    .crane-housing {
      width: 50px;
      height: 24px;
      background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
      border-radius: 8px 8px 4px 4px;
      border: 2px solid #a16207;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      position: relative;
    }

    .crane-housing::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 8px;
      background: #ef4444;
      border-radius: 4px;
    }

    .crane-rope {
      width: 4px;
      height: 45px;
      background: repeating-linear-gradient(180deg, #cbd5e1, #cbd5e1 4px, #64748b 4px, #64748b 8px);
      transition: height 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Kuku Capit 3D */
    .claw-hub {
      width: 28px;
      height: 12px;
      background: #eab308;
      border-radius: 4px;
      border: 2px solid #854d0e;
      position: relative;
    }

    .claw-leg {
      position: absolute;
      width: 6px;
      height: 32px;
      background: linear-gradient(180deg, #fef08a 0%, #ca8a04 100%);
      border: 1.5px solid #854d0e;
      top: 6px;
      border-radius: 4px;
      transition: transform 0.3s ease;
    }

    .leg-left {
      left: -2px;
      transform-origin: top left;
      transform: rotate(26deg);
      border-bottom-left-radius: 12px;
    }

    .leg-right {
      right: -2px;
      transform-origin: top right;
      transform: rotate(-26deg);
      border-bottom-right-radius: 12px;
    }

    /* Corong Hadiah (Prize Chute) Di Kiri */
    .prize-chute {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 90px;
      height: 130px;
      background: linear-gradient(135deg, #1d4ed8 0%, #172554 100%);
      border-top: 4px solid #60a5fa;
      border-right: 4px solid #60a5fa;
      border-top-right-radius: 18px;
      box-shadow: inset -6px 6px 14px rgba(0,0,0,0.6);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #93c5fd;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .prize-chute i {
      font-size: 1.6rem;
      color: #facc15;
      margin-bottom: 4px;
      animation: bounceChute 1.8s infinite alternate;
    }

    /* Bak Timbunan Patung Maskot Lucu */
    .plushie-pit {
      position: absolute;
      bottom: 0;
      left: 90px;
      right: 0;
      height: 125px;
      display: flex;
      flex-wrap: wrap-reverse;
      justify-content: center;
      align-content: flex-start;
      gap: 6px;
      padding: 8px;
      background: rgba(0,0,0,0.25);
      border-top-left-radius: 14px;
    }

    .plushie {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3), inset -3px -3px 0 rgba(0,0,0,0.2);
      animation: plushieFloat 2.8s ease-in-out infinite alternate;
    }

    /* PANEL KAWALAN ARKED BAWAH (CONTROLLER DECK) */
    .control-panel {
      margin-top: 12px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-radius: 20px;
      padding: 14px 18px;
      border: 3px solid #3b82f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 3px 0 rgba(255,255,255,0.1), 0 8px 20px rgba(0,0,0,0.4);
    }

    /* Joystick & Butang Arah */
    .joystick-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-move {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 3px solid #475569;
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      color: #f8fafc;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #0f172a, 0 6px 12px rgba(0,0,0,0.3);
      transition: all 0.1s;
    }

    .btn-move:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0f172a;
      background: #475569;
    }

    /* Butang Bulat Merah "GRAB" */
    .btn-grab {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 4px solid #991b1b;
      background: radial-gradient(circle at 35% 35%, #ef4444 0%, #b91c1c 70%);
      color: white;
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 0 #7f1d1d, 0 12px 24px rgba(239, 68, 68, 0.45);
      transition: all 0.1s;
    }

    .btn-grab:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #7f1d1d;
    }

    .btn-grab:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Pengurusan Senarai Nama Murid */
    .names-section {
      width: 100%;
      background: rgba(30, 41, 59, 0.85);
      border-radius: 20px;
      padding: 16px 18px;
      border: 2px solid #475569;
      margin-top: 16px;
    }

    .names-section textarea {
      width: 100%;
      height: 80px;
      border-radius: 12px;
      border: 1.5px solid #64748b;
      background: #0f172a;
      color: white;
      padding: 10px;
      font-size: 0.88rem;
      outline: none;
      margin-top: 8px;
      resize: vertical;
    }

    .names-section textarea:focus {
      border-color: #38bdf8;
    }

    /* Pop-up Pemenang Arkade */
    .winner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .winner-box {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      padding: 30px 24px;
      border-radius: 28px;
      text-align: center;
      width: 100%;
      max-width: 380px;
      border: 4px solid #facc15;
      box-shadow: 0 20px 50px rgba(250, 204, 21, 0.35);
      animation: popBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .winner-box h2 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #facc15;
      margin: 14px 0 22px;
      word-break: break-word;
      text-shadow: 0 4px 10px rgba(250, 204, 21, 0.4);
    }

    .btn-next {
      width: 100%;
      padding: 12px;
      border-radius: 99px;
      border: none;
      background: linear-gradient(135deg, #f472b6, #a78bfa);
      color: white;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Animasi */
    @keyframes plushieFloat {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }
    @keyframes bounceChute {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }
    @keyframes popBounce {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Bar Navigasi Atas -->
  <header class="header">
    <a href="../index.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Menu Utama
    </a>
    <span style="font-weight: 900; color: #facc15; letter-spacing: 0.5px;">🕹️ CLAW MASTER</span>
  </header>

  <div class="game-wrapper">
    <!-- RANGKA MESIN KABINET ARKED -->
    <div class="arcade-frame">
      <div class="neon-pillar-left"></div>
      <div class="neon-pillar-right"></div>

      <div class="glass-chamber" id="glass-stage">
        <div class="glass-glare"></div>
        <div class="top-rail"></div>

        <!-- Mekanisme Derek Kuning Capit -->
        <div class="crane-carriage" id="crane-unit" style="left: 65%;">
          <div class="crane-housing"></div>
          <div class="crane-rope" id="crane-rope"></div>
          <div class="claw-hub">
            <div class="claw-leg leg-left" id="leg-left"></div>
            <div class="claw-leg leg-right" id="leg-right"></div>
          </div>
        </div>

        <!-- Corong Hadiah Sisi Kiri -->
        <div class="prize-chute">
          <i class="fa-solid fa-gift"></i>
          <span>PRIZE<br>DROP</span>
        </div>

        <!-- Bak Patung Comel -->
        <div class="plushie-pit" id="plushie-container">
          <!-- Patung dimuatkan oleh JS -->
        </div>
      </div>

      <!-- PANEL KAWALAN ARKED (ARAH & BUTANG GRAB) -->
      <div class="control-panel">
        <div class="joystick-group">
          <button class="btn-move" id="btn-left" title="Gerak Kiri"><i class="fa-solid fa-caret-left"></i></button>
          <button class="btn-move" id="btn-right" title="Gerak Kanan"><i class="fa-solid fa-caret-right"></i></button>
        </div>

        <button class="btn-grab" id="btn-grab" onclick="triggerGrab()">
          <span>GRAB</span>
        </button>
      </div>
    </div>

    <!-- PENGURUSAN SENARAI NAMA MURID -->
    <div class="names-section">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label style="font-weight: 800; font-size: 0.88rem; color: #e2e8f0;">
          <i class="fa-solid fa-users" style="color: #facc15;"></i> Senarai Nama Murid:
        </label>
        <span id="name-count-pill" style="font-size: 0.78rem; font-weight: 800; color: #f472b6;">8 Nama</span>
      </div>

      <textarea id="names-box" placeholder="Satu nama setiap baris..." oninput="onNamesChanged()"></textarea>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
        <label style="font-size: 0.82rem; color: #94a3b8; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="chk-remove" checked>
          <span>Singkir nama yang terpilih</span>
        </label>
        <button onclick="restoreDefaults()" style="background: none; border: none; color: #38bdf8; font-size: 0.78rem; text-decoration: underline; cursor: pointer;">
          Reset
        </button>
      </div>
    </div>
  </div>

  <!-- POP-UP PEMENANG -->
  <div class="winner-overlay" id="winner-popup">
    <div class="winner-box">
      <p style="font-size: 0.85rem; font-weight: 800; color: #94a3b8; letter-spacing: 1px;">PATUNG TERPILIH UNTUK</p>
      <h2 id="chosen-name">-</h2>
      <button class="btn-next" onclick="dismissWinner()">Giliran Seterusnya</button>
    </div>
  </div>

  <script>
    const plushieEmojis = ['🐸', '🐰', '🐥', '🐱', '🐙', '🐻', '🐼', '🦊', '🦄', '🐨'];
    const initialList = ['Ahmad', 'Sarah', 'Danish', 'Aisyah', 'Chong', 'Muthu', 'Haziq', 'Nurul'];
    let studentNames = JSON.parse(localStorage.getItem('bbm_names')) || initialList;

    let cranePosition = 65; // Peratusan dari kiri (30% hingga 85%)
    let isMoving = false;
    let isBusy = false;
    let moveInterval = null;

    const craneUnit = document.getElementById('crane-unit');
    const craneRope = document.getElementById('crane-rope');
    const legLeft = document.getElementById('leg-left');
    const legRight = document.getElementById('leg-right');
    const btnGrab = document.getElementById('btn-grab');

    function renderPlushies() {
      const pit = document.getElementById('plushie-container');
      const colors = ['#f472b6', '#34d399', '#facc15', '#60a5fa', '#a78bfa', '#fb923c'];
      
      pit.innerHTML = studentNames.slice(0, 10).map((_, idx) => `
        <div class="plushie" style="background: ${colors[idx % colors.length]}; animation-delay: ${idx * 0.2}s;">
          ${plushieEmojis[idx % plushieEmojis.length]}
        </div>
      `).join('');
    }

    function syncStorage() {
      localStorage.setItem('bbm_names', JSON.stringify(studentNames));
      document.getElementById('name-count-pill').textContent = studentNames.length + ' Nama';
    }

    function onNamesChanged() {
      const txt = document.getElementById('names-box').value;
      studentNames = txt.split('\n').map(n => n.trim()).filter(Boolean);
      syncStorage();
      renderPlushies();
    }

    function restoreDefaults() {
      studentNames = [...initialList];
      document.getElementById('names-box').value = studentNames.join('\n');
      syncStorage();
      renderPlushies();
    }

    // KAWALAN PERGERAKAN CRANE
    function moveLeft() {
      if (isBusy || cranePosition <= 30) return;
      cranePosition -= 3;
      if (cranePosition < 30) cranePosition = 30;
      craneUnit.style.left = cranePosition + '%';
    }

    function moveRight() {
      if (isBusy || cranePosition >= 85) return;
      cranePosition += 3;
      if (cranePosition > 85) cranePosition = 85;
      craneUnit.style.left = cranePosition + '%';
    }

    // Sambungkan butang tekan/tahan untuk skrin sentuh & tetikus
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    function setupHoldButton(btn, action) {
      btn.addEventListener('mousedown', () => { action(); moveInterval = setInterval(action, 80); });
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); action(); moveInterval = setInterval(action, 80); });
      window.addEventListener('mouseup', () => clearInterval(moveInterval));
      window.addEventListener('touchend', () => clearInterval(moveInterval));
    }
    setupHoldButton(btnLeft, moveLeft);
    setupHoldButton(btnRight, moveRight);

    // Sambungkan anak panah papan kekunci
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') moveLeft();
      if (e.key === 'ArrowRight') moveRight();
      if (e.key === ' ' || e.key === 'Enter') triggerGrab();
    });

    // MEKANIK GRAB & JATUH KE CORONG HADIAH
    function triggerGrab() {
      if (isBusy) return;
      if (studentNames.length === 0) {
        alert('Sila masukkan sekurang-kurangnya 1 nama murid!');
        return;
      }

      isBusy = true;
      btnGrab.disabled = true;

      const luckyIdx = Math.floor(Math.random() * studentNames.length);
      const winnerName = studentNames[luckyIdx];

      // 1. Kuku Turun Menjunam
      craneRope.style.height = '165px';

      setTimeout(() => {
        // 2. Kuku Mencengkam Rapat
        legLeft.style.transform = 'rotate(40deg)';
        legRight.style.transform = 'rotate(-40deg)';

        setTimeout(() => {
          // 3. Kuku Naik Semula ke Atas Sambil Bawa Hadiah
          craneRope.style.height = '45px';

          setTimeout(() => {
            // 4. Bergerak ke Arah Corong Hadiah (Prize Drop di Kiri)
            craneUnit.style.transition = 'left 1s cubic-bezier(0.4, 0, 0.2, 1)';
            craneUnit.style.left = '16%';

            setTimeout(() => {
              // 5. Buka Kuku & Lepaskan Hadiah ke Corong
              legLeft.style.transform = 'rotate(26deg)';
              legRight.style.transform = 'rotate(-26deg)';

              setTimeout(() => {
                // 6. Paparkan Pemenang dengan Konfeti
                announceWinner(winnerName, luckyIdx);
              }, 400);
            }, 1000);
          }, 800);
        }, 500);
      }, 700);
    }

    function announceWinner(name, idx) {
      if (window.confetti) {
        confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
      }

      document.getElementById('chosen-name').textContent = name;
      document.getElementById('winner-popup').style.display = 'flex';

      if (document.getElementById('chk-remove').checked) {
        studentNames.splice(idx, 1);
        document.getElementById('names-box').value = studentNames.join('\n');
        syncStorage();
      }

      renderPlushies();
    }

    function dismissWinner() {
      document.getElementById('winner-popup').style.display = 'none';
      
      // Pulihkan posisi asal crane
      cranePosition = 65;
      craneUnit.style.transition = 'left 0.7s ease';
      craneUnit.style.left = '65%';
      
      setTimeout(() => {
        craneUnit.style.transition = 'left 0.15s linear';
        isBusy = false;
        btnGrab.disabled = false;
      }, 700);
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('names-box').value = studentNames.join('\n');
      syncStorage();
      renderPlushies();
    });
  </script>
</body>
</html>
