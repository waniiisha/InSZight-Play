<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Picker Interaktif - BilikBBM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #f472b6;
      --primary-hover: #ec4899;
      --accent: #a78bfa;
      --bg: #fdf2f8;
      --card: #ffffff;
      --text: #334155;
      --border: #fbcfe8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(244, 114, 182, 0.1);
    }

    .btn-back {
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tabs-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 14px 12px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 9px 18px;
      border-radius: 99px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(244, 114, 182, 0.35);
    }

    .stage-container {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* KABINET ARCADIA 3D CLAW MACHINE */
    .arcade-machine {
      width: 100%;
      background: #f472b6;
      border-radius: 28px 28px 20px 20px;
      box-shadow: 0 14px 30px rgba(236, 72, 153, 0.25), inset 0 4px 0 #fbcfe8, inset 0 -6px 0 #db2777;
      padding: 10px 10px 14px;
      border: 4px solid #db2777;
    }

    /* Kanopi Atap Mesin */
    .arcade-roof {
      height: 28px;
      background: repeating-linear-gradient(90deg, #ec4899, #ec4899 24px, #fbcfe8 24px, #fbcfe8 48px);
      border-radius: 18px 18px 6px 6px;
      border-bottom: 3px solid #db2777;
      margin-bottom: 8px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    /* Kotak Kaca Mesin */
    .glass-box {
      width: 100%;
      height: 330px;
      background: linear-gradient(180deg, #e0f2fe 0%, #f0fdf4 100%);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      border: 3px solid #cbd5e1;
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.2);
    }

    /* Efek Pantulan Kaca Transparan */
    .glass-reflection {
      position: absolute;
      top: 0;
      left: -20%;
      width: 60%;
      height: 100%;
      background: linear-gradient(105deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 60%);
      pointer-events: none;
      z-index: 8;
    }

    /* Rel Atas & Mesin Penggerak */
    .crane-rail {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 14px;
      background: linear-gradient(180deg, #94a3b8 0%, #475569 100%);
      border-bottom: 2px solid #334155;
      z-index: 6;
    }

    .crane-assembly {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 7;
      transition: left 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .crane-motor {
      width: 44px;
      height: 20px;
      background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
      border-radius: 6px;
      border: 2px solid #78350f;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    .crane-cable {
      width: 4px;
      height: 50px;
      background: repeating-linear-gradient(180deg, #64748b, #64748b 4px, #cbd5e1 4px, #cbd5e1 8px);
      transition: height 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Capit Mekanik 3D */
    .claw-bracket {
      width: 28px;
      height: 12px;
      background: #e11d48;
      border-radius: 4px;
      border: 2px solid #9f1239;
      position: relative;
    }

    .claw-finger-left, .claw-finger-right {
      position: absolute;
      width: 6px;
      height: 26px;
      background: linear-gradient(180deg, #e2e8f0 0%, #94a3b8 100%);
      border: 1.5px solid #475569;
      border-radius: 4px;
      top: 8px;
    }

    .claw-finger-left {
      left: 0;
      transform-origin: top left;
      transform: rotate(20deg);
      border-bottom-left-radius: 12px;
    }

    .claw-finger-right {
      right: 0;
      transform-origin: top right;
      transform: rotate(-20deg);
      border-bottom-right-radius: 12px;
    }

    /* Lubang Hadiah & Tumpukan Bola Kapsul Gashapon 3D */
    .capsules-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 110px;
      background: rgba(255, 255, 255, 0.3);
      display: flex;
      flex-wrap: wrap-reverse;
      justify-content: center;
      align-content: flex-start;
      gap: 10px;
      padding: 10px;
    }

    .gashapon-capsule {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(0,0,0,0.15);
      box-shadow: 0 5px 10px rgba(0,0,0,0.15), inset 0 -6px 0 rgba(0,0,0,0.15);
      animation: capsuleWiggle 2.5s ease-in-out infinite alternate;
    }

    .gashapon-capsule::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: rgba(255,255,255,0.45);
      border-bottom: 2px solid rgba(0,0,0,0.1);
    }

    .gashapon-capsule::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 8px;
      width: 10px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
    }

    /* TEMA BALON 3D */
    .balloon-board {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #fdf2f8 0%, #fae8ff 100%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      position: relative;
    }

    .realistic-balloon {
      width: 58px;
      height: 74px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      box-shadow: inset -6px -8px 0 rgba(0,0,0,0.15), 0 10px 15px rgba(0,0,0,0.08);
      position: relative;
      cursor: pointer;
      animation: floatSmooth 3s ease-in-out infinite alternate;
    }

    .realistic-balloon::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      width: 12px;
      height: 20px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      transform: rotate(-30deg);
    }

    .realistic-balloon::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 1.5px;
      height: 18px;
      background: #94a3b8;
    }

    /* TEMA KOLAM IKAN 3D */
    .sea-aquarium {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      position: relative;
      overflow: hidden;
    }

    .seaweed {
      position: absolute;
      bottom: 0;
      font-size: 2.2rem;
      color: #22c55e;
      animation: wavePlant 3s ease-in-out infinite alternate;
    }

    .cute-fish {
      position: absolute;
      font-size: 2.4rem;
      animation: swimFish 7s linear infinite;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    .hook-metal {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      color: #f1f5f9;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      transition: top 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Kontrol & Tombol */
    .action-btn {
      width: 100%;
      margin: 18px 0;
      padding: 15px 20px;
      border-radius: 99px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(244, 114, 182, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-btn:disabled {
      opacity: 0.6;
    }

    /* Pengaturan Daftar Nama */
    .names-manager {
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 18px 20px;
      border: 2px solid var(--border);
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
    }

    .names-manager textarea {
      width: 100%;
      height: 90px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      padding: 10px;
      font-size: 0.9rem;
      outline: none;
      margin-top: 8px;
      resize: vertical;
    }

    .row-settings {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Modal Pengumuman Nama */
    .modal-winner {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .card-winner {
      background: white;
      padding: 32px 24px;
      border-radius: 28px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      border: 4px solid var(--border);
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    }

    .card-winner h2 {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary-hover);
      margin: 12px 0 20px;
      word-break: break-word;
    }

    /* Animasi Pergerakan */
    @keyframes capsuleWiggle {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-4px) rotate(4deg); }
    }
    @keyframes floatSmooth {
      from { transform: translateY(0) rotate(-3deg); }
      to { transform: translateY(-16px) rotate(3deg); }
    }
    @keyframes swimFish {
      0% { left: -20%; transform: scaleX(1); }
      49% { transform: scaleX(1); }
      50% { left: 110%; transform: scaleX(-1); }
      100% { left: -20%; transform: scaleX(-1); }
    }
    @keyframes wavePlant {
      from { transform: rotate(-5deg); }
      to { transform: rotate(5deg); }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="../index.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Menu Utama
    </a>
    <span style="font-weight: 800; color: var(--primary);">BilikBBM</span>
  </header>

  <!-- Pilihan 3 Tema Visual -->
  <div class="tabs-bar">
    <button class="tab-btn active" id="btn-claw" onclick="selectTheme('claw')">🕹️ Arcade Claw</button>
    <button class="tab-btn" id="btn-balloon" onclick="selectTheme('balloon')">🎈 Pop Balloon</button>
    <button class="tab-btn" id="btn-fishing" onclick="selectTheme('fishing')">🎣 Deep Fishing</button>
  </div>

  <div class="stage-container">
    <!-- KABINET ARCADIA UTAMA -->
    <div class="arcade-machine">
      <div class="arcade-roof"></div>
      
      <div class="glass-box" id="arena-stage">
        <!-- Visual dimasukkan secara otomatis oleh JavaScript -->
      </div>
    </div>

    <!-- Tombol Tindakan Utama -->
    <button class="action-btn" id="btn-spin" onclick="executeDraw()">
      <i class="fa-solid fa-play"></i> Mulakan Cabutan!
    </button>

    <!-- Tempat Masuk Senarai Nama Murid Langsung -->
    <div class="names-manager">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label style="font-weight: 800; font-size: 0.9rem;">
          <i class="fa-solid fa-users" style="color: var(--primary);"></i> Senarai Nama Murid:
        </label>
        <span id="name-count" style="font-size: 0.8rem; font-weight: 800; color: #ec4899;">8 Nama</span>
      </div>
      
      <textarea id="names-text-input" placeholder="Tampal senarai nama di sini (satu nama setiap baris)..." oninput="updateNamesFromInput()"></textarea>

      <div class="row-settings">
        <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600;">
          <input type="checkbox" id="chk-auto-remove" checked>
          <span>Buang nama selepas terpilih</span>
        </label>
        <button onclick="resetDefaultNames()" style="background: none; border: none; color: #94a3b8; font-size: 0.8rem; cursor: pointer; text-decoration: underline;">
          Pulih Senarai Asal
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Pemenang Pop-up -->
  <div class="modal-winner" id="winner-modal">
    <div class="card-winner">
      <p style="font-size: 0.85rem; color: #64748b; font-weight: 800; text-transform: uppercase;">🎉 Tahniah Kepada 🎉</p>
      <h2 id="winner-name-display">-</h2>
      <button class="action-btn" style="padding: 12px;" onclick="closeModalWinner()">
        Cabut Seterusnya
      </button>
    </div>
  </div>

  <script>
    let activeTheme = 'claw';
    const defaultList = ['Ahmad', 'Sarah', 'Danish', 'Aisyah', 'Chong', 'Muthu', 'Haziq', 'Nurul'];
    let currentNames = JSON.parse(localStorage.getItem('bbm_names')) || defaultList;

    function saveNamesToStorage() {
      localStorage.setItem('bbm_names', JSON.stringify(currentNames));
      const countEl = document.getElementById('name-count');
      if (countEl) countEl.textContent = currentNames.length + ' Nama';
    }

    function updateNamesFromInput() {
      const val = document.getElementById('names-text-input').value;
      currentNames = val.split('\n').map(s => s.trim()).filter(Boolean);
      saveNamesToStorage();
      renderArena();
    }

    function resetDefaultNames() {
      currentNames = [...defaultList];
      document.getElementById('names-text-input').value = currentNames.join('\n');
      saveNamesToStorage();
      renderArena();
    }

    function selectTheme(theme) {
      activeTheme = theme;
      document.getElementById('btn-claw').classList.toggle('active', theme === 'claw');
      document.getElementById('btn-balloon').classList.toggle('active', theme === 'balloon');
      document.getElementById('btn-fishing').classList.toggle('active', theme === 'fishing');
      renderArena();
    }

    function renderArena() {
      const stage = document.getElementById('arena-stage');
      if (!stage) return;

      if (activeTheme === 'claw') {
        const capsuleColors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
        const capsules = currentNames.slice(0, 10).map((_, i) => 
          `<div class="gashapon-capsule" style="background: ${capsuleColors[i % capsuleColors.length]}; animation-delay: ${i * 0.2}s;"></div>`
        ).join('');

        stage.innerHTML = `
          <div class="glass-reflection"></div>
          <div class="crane-rail"></div>
          <div class="crane-assembly" id="crane-assembly">
            <div class="crane-motor"></div>
            <div class="crane-cable" id="crane-cable"></div>
            <div class="claw-bracket">
              <div class="claw-finger-left" id="claw-l"></div>
              <div class="claw-finger-right" id="claw-r"></div>
            </div>
          </div>
          <div class="capsules-container">${capsules}</div>
        `;
      } else if (activeTheme === 'balloon') {
        const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
        const balloons = currentNames.slice(0, 8).map((_, i) => 
          `<div class="realistic-balloon" onclick="executeDraw()" style="background: ${colors[i % colors.length]}; animation-delay: ${i * 0.25}s;"></div>`
        ).join('');

        stage.innerHTML = `<div class="balloon-board">${balloons}</div>`;
      } else if (activeTheme === 'fishing') {
        stage.innerHTML = `
          <div class="sea-aquarium">
            <div class="hook-metal" id="metal-hook"><i class="fa-solid fa-anchor"></i></div>
            <div class="cute-fish" style="top: 25%;"><i class="fa-solid fa-fish" style="color: #fb923c;"></i></div>
            <div class="cute-fish" style="top: 55%; animation-duration: 8s;"><i class="fa-solid fa-fish-fins" style="color: #f472b6;"></i></div>
            <div class="seaweed" style="left: 10%;"><i class="fa-solid fa-seedling"></i></div>
            <div class="seaweed" style="right: 15%; animation-delay: 1s;"><i class="fa-solid fa-seedling"></i></div>
          </div>
        `;
      }
    }

    function executeDraw() {
      if (currentNames.length === 0) {
        alert('Sila masukkan sekurang-kurangnya 1 nama murid!');
        return;
      }

      const spinBtn = document.getElementById('btn-spin');
      spinBtn.disabled = true;

      const luckyIndex = Math.floor(Math.random() * currentNames.length);
      const chosenName = currentNames[luckyIndex];

      if (activeTheme === 'claw') {
        const crane = document.getElementById('crane-assembly');
        const cable = document.getElementById('crane-cable');
        const clawL = document.getElementById('claw-l');
        const clawR = document.getElementById('claw-r');

        // Geser ke posisi acak
        crane.style.left = `${30 + Math.random() * 40}%`;
        
        setTimeout(() => {
          // Turunkan kabel cakar
          cable.style.height = '145px';
          setTimeout(() => {
            // Rapatkan cakar seolah mencengkeram
            clawL.style.transform = 'rotate(35deg)';
            clawR.style.transform = 'rotate(-35deg)';
            setTimeout(() => {
              // Tarik ke atas kembali
              cable.style.height = '50px';
              setTimeout(() => {
                announceWinner(chosenName, luckyIndex);
                clawL.style.transform = 'rotate(20deg)';
                clawR.style.transform = 'rotate(-20deg)';
              }, 700);
            }, 500);
          }, 700);
        }, 600);
      } else if (activeTheme === 'fishing') {
        const hook = document.getElementById('metal-hook');
        hook.style.top = '140px';
        setTimeout(() => {
          hook.style.top = '-120px';
          setTimeout(() => {
            announceWinner(chosenName, luckyIndex);
          }, 600);
        }, 700);
      } else {
        announceWinner(chosenName, luckyIndex);
      }
    }

    function announceWinner(name, index) {
      if (window.confetti) {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }

      document.getElementById('winner-name-display').textContent = name;
      document.getElementById('winner-modal').style.display = 'flex';

      if (document.getElementById('chk-auto-remove').checked) {
        currentNames.splice(index, 1);
        document.getElementById('names-text-input').value = currentNames.join('\n');
        saveNamesToStorage();
      }

      document.getElementById('btn-spin').disabled = false;
      renderArena();
    }

    function closeModalWinner() {
      document.getElementById('winner-modal').style.display = 'none';
      renderArena();
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('names-text-input').value = currentNames.join('\n');
      saveNamesToStorage();
      renderArena();
    });
  </script>
</body>
</html>
