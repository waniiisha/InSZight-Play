<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Claw 3D - BilikBBM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #f472b6;
      --accent: #818cf8;
      --bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(15, 23, 42, 0.9);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #312e81;
    }

    .btn-back {
      text-decoration: none;
      color: #94a3b8;
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stage-wrapper {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 12px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* KABINET ARKED 3D */
    .arcade-chassis {
      width: 100%;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      border-radius: 28px;
      border: 4px solid #1e40af;
      box-shadow: 0 20px 45px rgba(0,0,0,0.65), inset 0 5px 0 #93c5fd, inset 0 -7px 0 #1e3a8a;
      padding: 12px;
      position: relative;
    }

    .led-strip-l, .led-strip-r {
      position: absolute;
      top: 14px;
      bottom: 74px;
      width: 12px;
      border-radius: 99px;
      background: repeating-linear-gradient(180deg, #fde047, #fde047 12px, #2563eb 12px, #2563eb 24px);
      box-shadow: 0 0 14px #facc15;
      z-index: 10;
    }
    .led-strip-l { left: 4px; }
    .led-strip-r { right: 4px; }

    /* RUANG KACA PERSPEKTIF 3D */
    .glass-room {
      width: 100%;
      height: 350px;
      background: linear-gradient(180deg, #0369a1 0%, #075985 45%, #082f49 100%);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      border: 3px solid #38bdf8;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      perspective: 800px;
    }

    /* Lantai Bergrid 3D Isometrik */
    .isometric-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      background: linear-gradient(180deg, rgba(30, 27, 75, 0.4) 0%, rgba(15, 23, 42, 0.8) 100%);
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.15) 1px, transparent 1px);
      border-top: 2px solid rgba(56, 189, 248, 0.3);
      z-index: 2;
    }

    .glass-reflection {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.05) 35%, transparent 65%);
      pointer-events: none;
      z-index: 25;
    }

    .rail-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 18px;
      background: linear-gradient(180deg, #64748b 0%, #1e293b 100%);
      border-bottom: 2px solid #0f172a;
      z-index: 15;
    }

    /* KREN & CAKAR KUNING METALIK */
    .claw-unit {
      position: absolute;
      top: 10px;
      left: 65%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 18;
      transition: left 0.1s linear;
    }

    .crane-box {
      width: 58px;
      height: 28px;
      background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
      border-radius: 8px 8px 4px 4px;
      border: 2.5px solid #713f12;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crane-core {
      width: 18px;
      height: 10px;
      background: #ef4444;
      border-radius: 4px;
    }

    .crane-wire {
      width: 5px;
      height: 40px;
      background: repeating-linear-gradient(180deg, #cbd5e1, #cbd5e1 5px, #475569 5px, #475569 10px);
      transition: height 0.8s cubic-bezier(0.3, 0, 0.2, 1);
    }

    /* Pincers & Held Doll Container */
    .claw-pincers {
      width: 48px;
      height: 42px;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .pincer-leg {
      position: absolute;
      width: 8px;
      height: 38px;
      background: linear-gradient(180deg, #fef08a 0%, #eab308 60%, #a16207 100%);
      border: 1.5px solid #713f12;
      border-radius: 4px;
      transition: transform 0.3s ease;
      z-index: 2;
    }

    .pincer-l {
      left: 2px;
      top: 0;
      transform-origin: top left;
      transform: rotate(26deg);
      border-bottom-left-radius: 14px;
    }

    .pincer-r {
      right: 2px;
      top: 0;
      transform-origin: top right;
      transform: rotate(-26deg);
      border-bottom-right-radius: 14px;
    }

    /* Patung Yang Dicengkam Di Dalam Kuku */
    .held-doll {
      position: absolute;
      top: 10px;
      width: 44px;
      height: 44px;
      z-index: 1;
      display: none;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
      animation: wiggleInClaw 0.5s ease-in-out infinite alternate;
    }

    /* CORONG HADIAH KIRI (PRIZE CHUTE) */
    .prize-drop {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 95px;
      height: 140px;
      background: linear-gradient(145deg, #1d4ed8 0%, #0f172a 100%);
      border-top: 4px solid #60a5fa;
      border-right: 4px solid #60a5fa;
      border-top-right-radius: 20px;
      box-shadow: inset -8px 8px 18px rgba(0,0,0,0.7);
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #93c5fd;
      font-weight: 900;
      font-size: 0.72rem;
    }

    .prize-drop i {
      font-size: 1.8rem;
      color: #facc15;
      margin-bottom: 6px;
      filter: drop-shadow(0 2px 8px #facc15);
    }

    /* TIMBUNAN PATUNG HAIWAN 3D DI DASAR */
    .plushie-ground {
      position: absolute;
      bottom: 6px;
      left: 100px;
      right: 8px;
      height: 130px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 6px;
      z-index: 4;
    }

    .animal-doll {
      width: 54px;
      height: 54px;
      position: relative;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.5));
      animation: dollIdle 2.5s ease-in-out infinite alternate;
      transition: opacity 0.3s, transform 0.3s;
    }

    .animal-doll svg, .held-doll svg {
      width: 100%;
      height: 100%;
    }

    /* DEK KAWALAN */
    .arcade-deck {
      margin-top: 10px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-radius: 20px;
      padding: 12px 18px;
      border: 3px solid #3b82f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.15), 0 8px 24px rgba(0,0,0,0.5);
    }

    .stick-arrows {
      display: flex;
      gap: 10px;
    }

    .btn-steer {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      border: 3px solid #475569;
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      color: #ffffff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #0f172a, 0 6px 12px rgba(0,0,0,0.4);
    }

    .btn-steer:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0f172a;
      background: #475569;
    }

    .btn-grab-big {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 4px solid #991b1b;
      background: radial-gradient(circle at 35% 35%, #f87171 0%, #ef4444 45%, #991b1b 100%);
      color: white;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 8px 0 #7f1d1d, 0 14px 28px rgba(239, 68, 68, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-grab-big:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #7f1d1d;
    }

    .btn-grab-big:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* PENGURUSAN NAMA */
    .names-box {
      width: 100%;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 20px;
      padding: 16px 18px;
      border: 2px solid #475569;
      margin-top: 14px;
    }

    .names-box textarea {
      width: 100%;
      height: 75px;
      border-radius: 12px;
      border: 1.5px solid #64748b;
      background: #0f172a;
      color: white;
      padding: 10px;
      font-size: 0.88rem;
      outline: none;
      margin-top: 8px;
      resize: vertical;
    }

    /* POP-UP TAHNIAH */
    .modal-winner {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .winner-sheet {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      padding: 30px 24px;
      border-radius: 28px;
      text-align: center;
      width: 100%;
      max-width: 380px;
      border: 4px solid #facc15;
      box-shadow: 0 20px 50px rgba(250, 204, 21, 0.4);
    }

    .winner-sheet h2 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #facc15;
      margin: 12px 0 20px;
      text-shadow: 0 4px 12px rgba(250, 204, 21, 0.4);
    }

    .btn-again {
      width: 100%;
      padding: 14px;
      border-radius: 99px;
      border: none;
      background: linear-gradient(135deg, #f472b6, #818cf8);
      color: white;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
    }

    @keyframes dollIdle {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-4px) scale(1.02); }
    }
    @keyframes wiggleInClaw {
      from { transform: rotate(-4deg); }
      to { transform: rotate(4deg); }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="../index.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Menu Utama
    </a>
    <span style="font-weight: 900; color: #facc15;">🕹️ 3D ANIMAL CLAW</span>
  </header>

  <div class="stage-wrapper">
    <div class="arcade-chassis">
      <div class="led-strip-l"></div>
      <div class="led-strip-r"></div>

      <div class="glass-room">
        <div class="glass-reflection"></div>
        <div class="rail-bar"></div>
        <div class="isometric-floor"></div>

        <!-- Mekanisme Cakar Kuning Metalik -->
        <div class="claw-unit" id="claw-unit" style="left: 65%;">
          <div class="crane-box"><div class="crane-core"></div></div>
          <div class="crane-wire" id="crane-wire"></div>
          <div class="claw-pincers">
            <div class="pincer-leg pincer-l" id="pin-l"></div>
            <div class="pincer-leg pincer-r" id="pin-r"></div>
            <!-- Patung Yang Terangkat Bersama Cakar -->
            <div class="held-doll" id="held-doll"></div>
          </div>
        </div>

        <!-- Corong Hadiah Sisi Kiri -->
        <div class="prize-drop">
          <i class="fa-solid fa-gift"></i>
          <span>PRIZE<br>DROP</span>
        </div>

        <!-- Timbunan Patung Haiwan 3D -->
        <div class="plushie-ground" id="dolls-container"></div>
      </div>

      <!-- DEK KAWALAN -->
      <div class="arcade-deck">
        <div class="stick-arrows">
          <button class="btn-steer" id="btn-left"><i class="fa-solid fa-arrow-left"></i></button>
          <button class="btn-steer" id="btn-right"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <button class="btn-grab-big" id="btn-grab" onclick="actionGrab()">
          GRAB
        </button>
      </div>
    </div>

    <!-- PENGURUSAN NAMA MURID -->
    <div class="names-box">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label style="font-weight: 800; font-size: 0.88rem;">
          <i class="fa-solid fa-users" style="color: #facc15;"></i> Senarai Nama Murid:
        </label>
        <span id="name-count" style="font-size: 0.78rem; font-weight: 800; color: #f472b6;">8 Nama</span>
      </div>

      <textarea id="names-text" placeholder="Satu nama setiap baris..." oninput="onNamesChanged()"></textarea>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
        <label style="font-size: 0.82rem; color: #94a3b8; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="chk-auto" checked>
          <span>Singkir nama yang terpilih</span>
        </label>
        <button onclick="restoreNames()" style="background: none; border: none; color: #38bdf8; font-size: 0.78rem; text-decoration: underline; cursor: pointer;">
          Reset Senarai
        </button>
      </div>
    </div>
  </div>

  <!-- POP-UP PEMENANG -->
  <div class="modal-winner" id="winner-modal">
    <div class="winner-sheet">
      <div id="winner-doll-avatar" style="width: 70px; height: 70px; margin: 0 auto 10px;"></div>
      <p style="font-size: 0.85rem; font-weight: 800; color: #94a3b8; letter-spacing: 1px;">PATUNG BERJAYA DITANGKAP UNTUK</p>
      <h2 id="winner-name">-</h2>
      <button class="btn-again" onclick="closeWinner()">Giliran Seterusnya</button>
    </div>
  </div>

  <script>
    // Koleksi Patung Haiwan SVG 3D
    const animalSVGs = [
      // 1. Kucing Merah Jambu
      `<svg viewBox="0 0 100 100">
        <circle cx="28" cy="28" r="14" fill="#ec4899"/>
        <circle cx="28" cy="28" r="8" fill="#fbcfe8"/>
        <circle cx="72" cy="28" r="14" fill="#ec4899"/>
        <circle cx="72" cy="28" r="8" fill="#fbcfe8"/>
        <circle cx="50" cy="56" r="36" fill="#f472b6"/>
        <circle cx="50" cy="52" r="30" fill="#f472b6"/>
        <circle cx="38" cy="48" r="5" fill="#1e1b4b"/><circle cx="39" cy="46" r="2" fill="#ffffff"/>
        <circle cx="62" cy="48" r="5" fill="#1e1b4b"/><circle cx="63" cy="46" r="2" fill="#ffffff"/>
        <circle cx="32" cy="56" r="4" fill="#f43f5e" opacity="0.6"/>
        <circle cx="68" cy="56" r="4" fill="#f43f5e" opacity="0.6"/>
        <polygon points="50,54 47,57 53,57" fill="#be185d"/>
        <path d="M 46 60 Q 50 63 54 60" stroke="#be185d" stroke-width="2" fill="none"/>
      </svg>`,

      // 2. Katak Hijau
      `<svg viewBox="0 0 100 100">
        <circle cx="32" cy="30" r="14" fill="#22c55e"/>
        <circle cx="32" cy="30" r="8" fill="#ffffff"/>
        <circle cx="32" cy="30" r="4" fill="#0f172a"/>
        <circle cx="68" cy="30" r="14" fill="#22c55e"/>
        <circle cx="68" cy="30" r="8" fill="#ffffff"/>
        <circle cx="68" cy="30" r="4" fill="#0f172a"/>
        <ellipse cx="50" cy="58" rx="36" ry="30" fill="#4ade80"/>
        <ellipse cx="50" cy="62" rx="24" ry="18" fill="#bbf7d0"/>
        <circle cx="32" cy="58" r="4" fill="#f472b6" opacity="0.7"/>
        <circle cx="68" cy="58" r="4" fill="#f472b6" opacity="0.7"/>
        <path d="M 40 62 Q 50 72 60 62" stroke="#15803d" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>`,

      // 3. Anak Ayam Kuning
      `<svg viewBox="0 0 100 100">
        <circle cx="50" cy="52" r="36" fill="#facc15"/>
        <circle cx="50" cy="48" r="32" fill="#fde047"/>
        <ellipse cx="16" cy="56" rx="6" ry="12" fill="#eab308" transform="rotate(20 16 56)"/>
        <ellipse cx="84" cy="56" rx="6" ry="12" fill="#eab308" transform="rotate(-20 84 56)"/>
        <circle cx="38" cy="46" r="4" fill="#0f172a"/><circle cx="39" cy="45" r="1.5" fill="#ffffff"/>
        <circle cx="62" cy="46" r="4" fill="#0f172a"/><circle cx="63" cy="45" r="1.5" fill="#ffffff"/>
        <circle cx="32" cy="52" r="4" fill="#fb923c" opacity="0.6"/>
        <circle cx="68" cy="52" r="4" fill="#fb923c" opacity="0.6"/>
        <polygon points="50,48 44,56 56,56" fill="#ea580c"/>
      </svg>`,

      // 4. Arnab Ungu
      `<svg viewBox="0 0 100 100">
        <ellipse cx="36" cy="22" rx="7" ry="20" fill="#c084fc"/>
        <ellipse cx="36" cy="22" rx="4" ry="14" fill="#fbcfe8"/>
        <ellipse cx="64" cy="22" rx="7" ry="20" fill="#c084fc"/>
        <ellipse cx="64" cy="22" rx="4" ry="14" fill="#fbcfe8"/>
        <circle cx="50" cy="56" r="34" fill="#d8b4fe"/>
        <circle cx="38" cy="52" r="4.5" fill="#1e1b4b"/><circle cx="39" cy="50" r="1.5" fill="#ffffff"/>
        <circle cx="62" cy="52" r="4.5" fill="#1e1b4b"/><circle cx="63" cy="50" r="1.5" fill="#ffffff"/>
        <circle cx="32" cy="58" r="4" fill="#f43f5e" opacity="0.5"/>
        <circle cx="68" cy="58" r="4" fill="#f43f5e" opacity="0.5"/>
        <polygon points="50,58 47,62 53,62" fill="#db2777"/>
      </svg>`
    ];

    const defaultNames = ['Ahmad', 'Sarah', 'Danish', 'Aisyah', 'Chong', 'Muthu', 'Haziq', 'Nurul'];
    let studentList = JSON.parse(localStorage.getItem('bbm_names')) || defaultNames;

    let clawX = 65;
    let busy = false;
    let holdTimer = null;
    let currentSelectedDollSvg = '';

    const clawUnit = document.getElementById('claw-unit');
    const craneWire = document.getElementById('crane-wire');
    const pinL = document.getElementById('pin-l');
    const pinR = document.getElementById('pin-r');
    const heldDoll = document.getElementById('held-doll');
    const btnGrab = document.getElementById('btn-grab');

    function renderDolls() {
      const container = document.getElementById('dolls-container');
      container.innerHTML = studentList.slice(0, 6).map((_, i) => `
        <div class="animal-doll" id="ground-doll-${i}" style="animation-delay: ${i * 0.3}s;">
          ${animalSVGs[i % animalSVGs.length]}
        </div>
      `).join('');
    }

    function sync() {
      localStorage.setItem('bbm_names', JSON.stringify(studentList));
      document.getElementById('name-count').textContent = studentList.length + ' Nama';
    }

    function onNamesChanged() {
      const val = document.getElementById('names-text').value;
      studentList = val.split('\n').map(s => s.trim()).filter(Boolean);
      sync();
      renderDolls();
    }

    function restoreNames() {
      studentList = [...defaultNames];
      document.getElementById('names-text').value = studentList.join('\n');
      sync();
      renderDolls();
    }

    function goLeft() {
      if (busy || clawX <= 30) return;
      clawX -= 3;
      if (clawX < 30) clawX = 30;
      clawUnit.style.left = clawX + '%';
    }

    function goRight() {
      if (busy || clawX >= 85) return;
      clawX += 3;
      if (clawX > 85) clawX = 85;
      clawUnit.style.left = clawX + '%';
    }

    function bindHold(btn, action) {
      btn.addEventListener('mousedown', () => { action(); holdTimer = setInterval(action, 80); });
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); action(); holdTimer = setInterval(action, 80); });
      window.addEventListener('mouseup', () => clearInterval(holdTimer));
      window.addEventListener('touchend', () => clearInterval(holdTimer));
    }
    bindHold(document.getElementById('btn-left'), goLeft);
    bindHold(document.getElementById('btn-right'), goRight);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') goLeft();
      if (e.key === 'ArrowRight') goRight();
      if (e.key === ' ' || e.key === 'Enter') actionGrab();
    });

    // MEKANIK GRAB & ANGKAT PATUNG SEBENAR
    function actionGrab() {
      if (busy) return;
      if (studentList.length === 0) {
        alert('Sila masukkan sekurang-kurangnya 1 nama murid!');
        return;
      }

      busy = true;
      btnGrab.disabled = true;

      const luckyIndex = Math.floor(Math.random() * studentList.length);
      const winnerName = studentList[luckyIndex];
      currentSelectedDollSvg = animalSVGs[luckyIndex % animalSVGs.length];

      // 1. Tali Turun Sepenuhnya Mencecah Dasar (220px)
      craneWire.style.height = '220px';

      setTimeout(() => {
        // 2. Kuku Mencengkam Rapat & Patung Ditangkap!
        pinL.style.transform = 'rotate(45deg)';
        pinR.style.transform = 'rotate(-45deg)';

        // Pasang patung ke dalam kuku cakar
        heldDoll.innerHTML = currentSelectedDollSvg;
        heldDoll.style.display = 'block';

        // Sembunyikan satu patung di lantai untuk efek seolah ia terangkat
        const groundDoll = document.getElementById(`ground-doll-${luckyIndex % 6}`);
        if (groundDoll) groundDoll.style.opacity = '0';

        setTimeout(() => {
          // 3. Tarik Naik Semula Bersama Patung
          craneWire.style.height = '40px';

          setTimeout(() => {
            // 4. Bergerak ke Arah Corong Hadiah Kiri (16%)
            clawUnit.style.transition = 'left 1s cubic-bezier(0.4, 0, 0.2, 1)';
            clawUnit.style.left = '16%';

            setTimeout(() => {
              // 5. Buka Kuku & Patung Jatuh ke Corong Hadiah
              pinL.style.transform = 'rotate(26deg)';
              pinR.style.transform = 'rotate(-26deg)';
              heldDoll.style.transition = 'top 0.4s ease-in, opacity 0.4s ease-in';
              heldDoll.style.top = '120px';
              heldDoll.style.opacity = '0';

              setTimeout(() => {
                // 6. Paparkan Pemenang dengan Konfeti
                showWinner(winnerName, luckyIndex);
              }, 450);
            }, 1050);
          }, 850);
        }, 550);
      }, 850);
    }

    function showWinner(name, idx) {
      if (window.confetti) {
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      }

      document.getElementById('winner-name').textContent = name;
      document.getElementById('winner-doll-avatar').innerHTML = currentSelectedDollSvg;
      document.getElementById('winner-modal').style.display = 'flex';

      if (document.getElementById('chk-auto').checked) {
        studentList.splice(idx, 1);
        document.getElementById('names-text').value = studentList.join('\n');
        sync();
      }

      renderDolls();
    }

    function closeWinner() {
      document.getElementById('winner-modal').style.display = 'none';

      // Reset held doll styles
      heldDoll.style.display = 'none';
      heldDoll.style.top = '10px';
      heldDoll.style.opacity = '1';
      heldDoll.style.transition = 'none';

      // Pulangkan kren ke posisi tengah
      clawX = 65;
      clawUnit.style.transition = 'left 0.7s ease';
      clawUnit.style.left = '65%';

      setTimeout(() => {
        clawUnit.style.transition = 'left 0.1s linear';
        busy = false;
        btnGrab.disabled = false;
      }, 700);
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('names-text').value = studentList.join('\n');
      sync();
      renderDolls();
    });
  </script>
</body>
</html>
