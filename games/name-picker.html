<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Picker Interaktif - BilikBBM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #f472b6;
      --primary-hover: #ec4899;
      --accent: #a78bfa;
      --bg: #fdf2f8;
      --card: #ffffff;
      --text: #334155;
      --border: #fbcfe8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation */
    .header {
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(244, 114, 182, 0.1);
    }

    .btn-back {
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Tabs Pilihan Tema */
    .tabs-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 14px 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 18px;
      border-radius: 99px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.3);
    }

    /* Arena Paparan Utama */
    .stage-container {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 16px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .game-screen {
      width: 100%;
      height: 380px;
      background: white;
      border-radius: 28px;
      border: 3px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Tema 1: Claw Machine */
    .claw-track {
      position: absolute;
      top: 0;
      width: 100%;
      height: 12px;
      background: #cbd5e1;
    }

    .claw-head {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      transition: top 0.7s ease, left 0.5s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .claw-rod {
      width: 4px;
      height: 40px;
      background: #64748b;
    }

    .claw-pincers {
      font-size: 24px;
      color: #e11d48;
      line-height: 1;
    }

    .capsule-pit {
      position: absolute;
      bottom: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: 90%;
    }

    .ball {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      box-shadow: inset -3px -3px 0 rgba(0,0,0,0.15);
      animation: floatBall 2s ease-in-out infinite alternate;
    }

    /* Tema 2: Balloons */
    .balloon-cluster {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }

    .balloon {
      width: 58px;
      height: 72px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      cursor: pointer;
      position: relative;
      animation: floatBalloon 2.5s ease-in-out infinite alternate;
      box-shadow: inset -4px -4px 0 rgba(0,0,0,0.1);
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 6px solid currentColor;
    }

    /* Tema 3: Fishing Pond */
    .pond {
      background: linear-gradient(180deg, #bae6fd 0%, #38bdf8 100%);
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .fish {
      position: absolute;
      font-size: 2rem;
      animation: swim 6s linear infinite;
    }

    .hook {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      color: #475569;
      transition: top 0.7s ease;
      z-index: 10;
    }

    /* Butang Aksi Bawah */
    .action-bar {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    .btn-action {
      padding: 12px 30px;
      border-radius: 99px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(244, 114, 182, 0.35);
    }

    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Modal Tetapan Senarai Nama */
    .drawer-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--border);
      color: var(--primary);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      cursor: pointer;
      z-index: 100;
    }

    .drawer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: flex-end;
      z-index: 200;
    }

    .drawer-content {
      background: white;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      border-radius: 24px 24px 0 0;
      padding: 24px;
    }

    .drawer-content textarea {
      width: 100%;
      height: 120px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      outline: none;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    /* Modal Pemenang */
    .winner-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 20px;
    }

    .winner-card {
      background: white;
      padding: 30px;
      border-radius: 24px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      border: 3px solid var(--border);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .winner-card h2 {
      font-size: 2rem;
      color: var(--primary-hover);
      margin: 14px 0;
      word-break: break-word;
    }

    /* Animasi */
    @keyframes floatBall { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    @keyframes floatBalloon { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-12px) rotate(2deg); } }
    @keyframes swim {
      0% { left: -10%; transform: scaleX(1); }
      49% { transform: scaleX(1); }
      50% { left: 100%; transform: scaleX(-1); }
      100% { left: -10%; transform: scaleX(-1); }
    }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <!-- Bar Atas -->
  <header class="header">
    <a href="../index.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Menu Utama
    </a>
    <span style="font-weight: 800; color: var(--primary);">BilikBBM</span>
  </header>

  <!-- Pilihan Tema -->
  <div class="tabs-bar">
    <button class="tab-btn active" onclick="switchTheme('claw')">🕹️ Mesin Cakar</button>
    <button class="tab-btn" onclick="switchTheme('balloon')">🎈 Letup Belon</button>
    <button class="tab-btn" onclick="switchTheme('fishing')">🎣 Kolam Ikan</button>
  </div>

  <!-- Arena Permainan -->
  <div class="stage-container">
    <div class="game-screen" id="arena">
      <!-- Kandungan Dinamik Tema Dimasukkan oleh JS -->
    </div>

    <div class="action-bar">
      <button class="btn-action" id="pick-btn" onclick="pickWinner()">
        <i class="fa-solid fa-play"></i> Mulakan Cabutan!
      </button>
    </div>
  </div>

  <!-- Butang Tetapan Nama -->
  <button class="drawer-btn" onclick="openDrawer()" title="Urus Nama Murid">
    <i class="fa-solid fa-user-pen"></i>
  </button>

  <!-- Drawer Senarai Nama -->
  <div class="drawer" id="names-drawer" onclick="closeDrawer(event)">
    <div class="drawer-content" onclick="event.stopPropagation()">
      <h3 style="font-weight: 800;">Senarai Nama Murid</h3>
      <p style="font-size: 0.8rem; color: #64748b;">Tulis atau tampal nama murid (satu nama setiap baris):</p>
      <textarea id="names-input"></textarea>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
        <input type="checkbox" id="auto-remove" checked>
        <label for="auto-remove" style="font-size: 0.85rem;">Buang nama selepas terpilih</label>
      </div>
      <button class="btn-action" style="width: 100%; margin-top: 14px; padding: 10px;" onclick="saveNames()">
        Simpan Senarai
      </button>
    </div>
  </div>

  <!-- Modal Pemenang -->
  <div class="winner-modal" id="winner-modal">
    <div class="winner-card">
      <p style="font-size: 0.85rem; color: #64748b; font-weight: 700;">TAHNIAH KEPADA</p>
      <h2 id="winner-name">-</h2>
      <button class="btn-action" style="padding: 10px 24px;" onclick="closeWinnerModal()">Seterusnya</button>
    </div>
  </div>

  <script>
    let currentTheme = 'claw';
    let names = JSON.parse(localStorage.getItem('bbm_names')) || [
      'Ahmad', 'Sarah', 'Danish', 'Aisyah', 'Chong', 'Muthu', 'Haziq', 'Nurul'
    ];

    const arena = document.getElementById('arena');
    const pickBtn = document.getElementById('pick-btn');

    function renderTheme() {
      if (currentTheme === 'claw') {
        arena.innerHTML = `
          <div class="claw-track"></div>
          <div class="claw-head" id="claw-head">
            <div class="claw-rod" id="claw-rod"></div>
            <div class="claw-pincers"><i class="fa-solid fa-hand-fist"></i></div>
          </div>
          <div class="capsule-pit">
            ${names.slice(0, 10).map((_, i) => `<div class="ball" style="background: ${['#f472b6','#60a5fa','#34d399','#fbbf24','#a78bfa'][i%5]};"></div>`).join('')}
          </div>
        `;
      } else if (currentTheme === 'balloon') {
        arena.innerHTML = `
          <div class="balloon-cluster">
            ${names.slice(0, 8).map((n, i) => `
              <div class="balloon" onclick="pickWinner()" style="background: ${['#f472b6','#60a5fa','#34d399','#fbbf24','#a78bfa'][i\%5]}; color: ${['#f472b6','#60a5fa','#34d399','#fbbf24','#a78bfa'][i%5]};"></div>
            `).join('')}
          </div>
        `;
      } else if (currentTheme === 'fishing') {
        arena.innerHTML = `
          <div class="pond">
            <div class="hook" id="fish-hook"><i class="fa-solid fa-anchor"></i></div>
            <div class="fish" style="top: 30%;"><i class="fa-solid fa-fish" style="color: #f97316;"></i></div>
            <div class="fish" style="top: 60%; animation-duration: 8s;"><i class="fa-solid fa-fish" style="color: #ec4899;"></i></div>
            <div class="fish" style="top: 75%; animation-duration: 5s;"><i class="fa-solid fa-shrimp" style="color: #ef4444;"></i></div>
          </div>
        `;
      }
    }

    function switchTheme(theme) {
      currentTheme = theme;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderTheme();
    }

    function pickWinner() {
      if (names.length === 0) {
        alert('Sila masukkan sekurang-kurangnya satu nama di butang tetapan!');
        openDrawer();
        return;
      }

      pickBtn.disabled = true;
      const selectedIndex = Math.floor(Math.random() * names.length);
      const chosen = names[selectedIndex];

      if (currentTheme === 'claw') {
        const claw = document.getElementById('claw-head');
        const rod = document.getElementById('claw-rod');
        claw.style.left = '30%';
        setTimeout(() => {
          rod.style.height = '160px';
          setTimeout(() => {
            rod.style.height = '40px';
            setTimeout(() => { showWinner(chosen, selectedIndex); }, 700);
          }, 700);
        }, 500);
      } else if (currentTheme === 'fishing') {
        const hook = document.getElementById('fish-hook');
        hook.style.top = '140px';
        setTimeout(() => {
          hook.style.top = '-100px';
          setTimeout(() => { showWinner(chosen, selectedIndex); }, 700);
        }, 800);
      } else {
        showWinner(chosen, selectedIndex);
      }
    }

    function showWinner(name, index) {
      confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
      document.getElementById('winner-name').textContent = name;
      document.getElementById('winner-modal').style.display = 'flex';

      if (document.getElementById('auto-remove').checked) {
        names.splice(index, 1);
        localStorage.setItem('bbm_names', JSON.stringify(names));
      }
      pickBtn.disabled = false;
      renderTheme();
    }

    function closeWinnerModal() {
      document.getElementById('winner-modal').style.display = 'none';
      renderTheme();
    }

    function openDrawer() {
      document.getElementById('names-input').value = names.join('\n');
      document.getElementById('names-drawer').style.display = 'flex';
    }

    function closeDrawer(e) {
      document.getElementById('names-drawer').style.display = 'none';
    }

    function saveNames() {
      const raw = document.getElementById('names-input').value;
      names = raw.split('\n').map(s => s.trim()).filter(Boolean);
      localStorage.setItem('bbm_names', JSON.stringify(names));
      closeDrawer();
      renderTheme();
    }

    // Inisialisasi awal
    renderTheme();
  </script>
</body>
</html>
